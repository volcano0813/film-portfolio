<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elia's Thought Contact Sheet</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    :root{--surface:#fff8e8;--surface-soft:#fffdf6;--ink:#171512;--ink-soft:#5b554c;--line:rgba(23,21,18,.18);--yellow:#ffd23f;--blue:#2453d4;--coral:#ff7058;--pink:#ff4f9a;--cyan:#35cfc7;--lilac:#a990e8}
    html[data-theme="darkroom"]{--surface:#080b16;--surface-soft:#111522;--ink:#f8f1df;--ink-soft:#bbb3a6;--line:rgba(255,248,232,.18)}
    *{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{min-height:100svh;background:var(--surface);color:var(--ink);font-family:"Noto Serif SC",serif;transition:background .35s ease,color .35s ease}body::after{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
    .nav{position:fixed;z-index:1000;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:6px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--surface-soft) 88%,transparent);box-shadow:0 12px 35px rgba(23,21,18,.12);backdrop-filter:blur(18px)}.nav a,.theme-toggle{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:500 10px/1 "DM Mono",monospace;letter-spacing:.08em;text-decoration:none;cursor:pointer;white-space:nowrap}.nav a:hover,.nav a:focus-visible,.nav a[aria-current="page"]{background:var(--yellow);color:#171512}.theme-toggle{background:#171512;color:#fff8e8}.theme-toggle:hover,.theme-toggle:focus-visible{background:var(--blue)}.theme-orb{width:12px;height:12px;border-radius:50%;background:var(--yellow);box-shadow:inset -3px -2px 0 rgba(23,21,18,.35)}
    main{padding:132px clamp(22px,6vw,90px) 100px;position:relative;overflow:hidden}main::before{content:"";position:absolute;width:55vw;height:55vw;left:-24vw;top:-25vw;border-radius:50%;background:var(--pink);opacity:.48}.hero{position:relative;z-index:2;width:min(1240px,100%);margin:0 auto 80px}.kicker{margin-bottom:20px;font:500 11px/1 "DM Mono",monospace;letter-spacing:.17em}.hero h1{max-width:1000px;font:400 clamp(58px,9vw,132px)/.84 "Archivo Black",sans-serif;letter-spacing:-.07em}.hero h1 em{color:var(--blue);font-family:"Playfair Display",serif;font-weight:600}.hero p{max-width:650px;margin-top:30px;color:var(--ink-soft);font-size:clamp(15px,1.4vw,19px);font-weight:600;line-height:1.85}
    .filters{position:relative;z-index:2;width:min(1240px,100%);display:flex;gap:9px;flex-wrap:wrap;margin:0 auto 36px}.filter{padding:10px 15px;border:2px solid #171512;border-radius:999px;background:var(--surface-soft);color:var(--ink);font:700 10px/1 "DM Mono",monospace;cursor:pointer;box-shadow:2px 3px 0 #171512}.filter.active{background:var(--yellow);color:#171512;transform:translate(1px,1px);box-shadow:1px 2px 0 #171512}
    .grid{position:relative;z-index:2;width:min(1240px,100%);margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 24px}.card{--card:#35cfc7;min-height:390px;padding:28px 25px 22px;border:2px solid #171512;border-radius:28px;background:var(--card);color:#171512;box-shadow:7px 9px 0 #171512;text-align:left;cursor:pointer;transform:rotate(var(--rotate,-1deg));transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}.card:nth-child(6n+2){--card:#f044da;--rotate:1.5deg}.card:nth-child(6n+3){--card:#ffd23f;--rotate:-1.7deg}.card:nth-child(6n+4){--card:#a990e8;--rotate:1deg}.card:nth-child(6n+5){--card:#ff7058;--rotate:-1.2deg}.card:nth-child(6n+6){--card:#8fd267;--rotate:1.8deg}.card:hover,.card:focus-visible{position:relative;z-index:3;transform:translateY(-10px) rotate(0);box-shadow:12px 14px 0 #171512;outline:none}.card-num{display:flex;justify-content:space-between;margin-bottom:32px;font:500 10px/1 "DM Mono",monospace;letter-spacing:.1em}.card-text{font-size:clamp(17px,1.35vw,22px);font-weight:700;line-height:1.65;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}.card-scene{margin-top:26px;font:500 10px/1.6 "DM Mono",monospace}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--ink-soft)}
    footer{padding:30px 24px;border-top:1px solid var(--line);color:var(--ink-soft);text-align:center;font:500 9px/1.5 "DM Mono",monospace;letter-spacing:.16em}.modal{position:fixed;inset:0;z-index:2000;display:none;place-items:center;padding:24px;background:rgba(23,21,18,.56);backdrop-filter:blur(12px)}.modal.open{display:grid}.modal-card{width:min(700px,100%);padding:clamp(30px,5vw,58px);border:3px solid #171512;border-radius:32px;background:var(--modal-color,var(--cyan));color:#171512;box-shadow:14px 16px 0 #171512;transform:rotate(-1deg)}.modal-close{float:right;width:42px;height:42px;border:2px solid #171512;border-radius:50%;background:transparent;font-size:20px;cursor:pointer}.modal-text{clear:both;padding-top:24px;font-size:clamp(20px,3vw,32px);font-weight:700;line-height:1.65}.modal-meta{display:flex;justify-content:space-between;gap:20px;margin-top:30px;font:500 11px/1.6 "DM Mono",monospace}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){.nav{width:calc(100% - 24px);top:10px;justify-content:flex-start;overflow-x:auto}.nav a,.theme-toggle{flex:0 0 auto;padding-inline:13px}main{padding:112px 20px 80px}.grid{grid-template-columns:1fr;gap:24px}.card{min-height:330px}.hero{margin-bottom:55px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.card{transform:none}}
  </style>
</head>
<body>
  <nav class="nav" aria-label="主要导航"><a href="index.html#opening">Opening</a><a href="index.html#works">Projects</a><a href="thoughts.html" aria-current="page">Thoughts</a><a href="about.html">About</a><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false"><span class="theme-orb" aria-hidden="true"></span><span data-theme-label>DARKROOM</span></button></nav>
  <main>
    <header class="hero"><div class="kicker">03 / DEVELOPING ROOM · 14 FRAMES</div><h1>Thought<br><em>Contact Sheet</em></h1><p>这里放一些在做 AI 产品时思考的痕迹。它们也许不够完整、不够成熟，但足够真实。点击任意卡片，让它在显影液里慢慢变清晰。</p></header>
    <div class="filters" id="filters" aria-label="按类别筛选"></div>
    <section class="grid" id="thoughtGrid" aria-live="polite" aria-label="全部思考"></section>
  </main>
  <footer>—— END OF CONTACT SHEET · FRAME 14 / 36 ——</footer>
  <div class="modal" id="thoughtModal" aria-hidden="true"><article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalText"><button class="modal-close" type="button" aria-label="关闭">×</button><p class="modal-text" id="modalText"></p><div class="modal-meta"><span id="modalScene"></span><span><span id="modalCategory"></span> · <span id="modalDate"></span></span></div></article></div>
  <script src="assets/thoughts-data.js"></script>
  <script>
    const thoughts=window.ELIA_THOUGHTS||[];const colors=['#35cfc7','#f044da','#ffd23f','#a990e8','#ff7058','#8fd267'];const grid=document.getElementById('thoughtGrid');const filters=document.getElementById('filters');const categories=['全部',...new Set(thoughts.map(item=>item.category))];let activeCategory='全部';let modalTrigger=null;
    filters.innerHTML=categories.map((category,index)=>`<button class="filter${index===0?' active':''}" type="button" data-category="${category}" aria-pressed="${index===0}">${category}</button>`).join('');
    function render(){const visible=activeCategory==='全部'?thoughts:thoughts.filter(item=>item.category===activeCategory);grid.innerHTML=visible.length?visible.map(item=>{const index=thoughts.indexOf(item);return `<button class="card" type="button" data-index="${index}" aria-label="打开第 ${index+1} 条思考"><span class="card-num"><span>FRAME ${String(index+1).padStart(2,'0')}</span><span>${item.date}</span></span><span class="card-text">${item.text}</span><span class="card-scene">${item.category}<br>${item.scene}</span></button>`}).join(''):'<p class="empty">这一卷暂时没有内容。</p>'}
    filters.addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;activeCategory=button.dataset.category;filters.querySelectorAll('.filter').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active))});render()});
    const modal=document.getElementById('thoughtModal');const closeButton=modal.querySelector('.modal-close');function openThought(index,trigger){const item=thoughts[index];if(!item)return;modalTrigger=trigger;modal.style.setProperty('--modal-color',colors[index%colors.length]);document.getElementById('modalText').textContent=item.text;document.getElementById('modalScene').textContent=item.scene;document.getElementById('modalCategory').textContent=item.category;document.getElementById('modalDate').textContent=item.date;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';closeButton.focus()}function closeThought(){if(!modal.classList.contains('open'))return;modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';if(modalTrigger)modalTrigger.focus({preventScroll:true})}
    grid.addEventListener('click',event=>{const card=event.target.closest('[data-index]');if(card)openThought(Number(card.dataset.index),card)});closeButton.addEventListener('click',closeThought);modal.addEventListener('click',event=>{if(event.target===modal)closeThought()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeThought()});render();
  </script>
</body>
</html>
