<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elia's Film Roll - Thoughts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0907;
  --ink: #f4eadb;
  --muted: #9a8d79;
  --soft: #c9b89e;
  --gold: #f5c518;
  --line: rgba(209, 168, 98, 0.16);
  --brown: #211812;
  --shadow: rgba(0, 0, 0, 0.48);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 16% 9%, rgba(244, 178, 79, 0.12), transparent 32%),
    radial-gradient(circle at 84% 16%, rgba(72, 176, 218, 0.11), transparent 34%),
    radial-gradient(circle at 52% 100%, rgba(116, 159, 94, 0.12), transparent 36%),
    var(--bg);
  color: var(--ink);
  font-family: 'DM Mono', monospace;
  cursor: none;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  opacity: 0.17;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 42px 42px;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 80;
  pointer-events: none;
  opacity: 0.075;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.9) 0 1px, transparent 1.6px),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.8) 0 1px, transparent 1.4px);
  background-size: 92px 92px, 137px 137px;
  mix-blend-mode: screen;
}

a { color: inherit; text-decoration: none; }

.cursor-dot,
.cursor-ring {
  position: fixed;
  top: 0;
  left: 0;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 9999;
}

.cursor-dot {
  width: 7px;
  height: 7px;
  background: var(--gold);
}

.cursor-ring {
  width: 34px;
  height: 34px;
  border: 1px solid rgba(245, 197, 24, 0.52);
  transition: width 0.18s ease, height 0.18s ease, border-color 0.18s ease;
}

.cursor-ring.is-hover {
  width: 54px;
  height: 54px;
  border-color: rgba(244, 234, 219, 0.62);
}

.film-perf {
  position: fixed;
  top: 0;
  bottom: 0;
  width: 44px;
  z-index: 20;
  pointer-events: none;
  border-color: rgba(154, 141, 121, 0.18);
  border-style: solid;
}

.film-perf.left {
  left: 0;
  border-width: 0 1px 0 0;
}

.film-perf.right {
  right: 0;
  border-width: 0 0 0 1px;
}

.film-perf::before {
  content: "";
  position: absolute;
  inset: 18px 12px;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 26px,
    rgba(244, 234, 219, 0.1) 26px 39px,
    transparent 39px 64px
  );
  opacity: 0.75;
}

.site-nav-corner {
  position: fixed;
  top: 30px;
  right: 42px;
  z-index: 100;
  display: flex;
  gap: 34px;
  align-items: flex-start;
}

.site-nav-corner__link {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: rgba(244, 234, 219, 0.38);
  text-transform: uppercase;
  transition: color 0.25s ease, transform 0.25s ease;
}

.site-nav-corner__link:hover,
.site-nav-corner__link.is-active {
  color: var(--gold);
  transform: translateY(-2px);
}

.site-nav-corner__cn {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 600;
}

.site-nav-corner__en {
  font-size: 8px;
  letter-spacing: 0.28em;
}

.page {
  width: min(1240px, calc(100vw - 112px));
  margin: 0 auto;
  padding: 34px 0 70px;
}

.back-link {
  position: fixed;
  top: 34px;
  left: 68px;
  z-index: 90;
  color: rgba(244, 234, 219, 0.42);
  font-size: 11px;
  letter-spacing: 0.32em;
  transition: color 0.25s ease, transform 0.25s ease;
}

.back-link:hover {
  color: var(--ink);
  transform: translateX(-4px);
}

.hero {
  min-height: 42vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 70px 0 44px;
}

.hero-kicker {
  font-size: 12px;
  letter-spacing: 0.54em;
  text-transform: uppercase;
  color: rgba(201, 184, 158, 0.68);
  text-align: center;
  margin-bottom: 24px;
}

.hero-title {
  font-family: 'Playfair Display', 'Noto Serif SC', serif;
  font-size: clamp(42px, 6.2vw, 78px);
  font-weight: 400;
  line-height: 1.02;
  text-align: center;
  letter-spacing: 0;
}

.hero-title span {
  color: var(--gold);
  font-style: italic;
}

.hero-subtitle {
  margin: 24px auto 0;
  max-width: 720px;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  line-height: 2;
  color: var(--soft);
  text-align: center;
}

.contact-sheet {
  padding: 4px 0 72px;
}

.polaroid-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 30px 22px;
  align-items: start;
}

.polaroid {
  --a: #f6b34d;
  --b: #e9863f;
  --tag: #a8392c;
  --tilt: -1.2deg;
  position: relative;
  aspect-ratio: 54 / 86;
  border: 0;
  border-radius: 5px;
  padding: 10px 10px 13px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--a) 88%, white), var(--b)),
    var(--a);
  box-shadow:
    0 22px 46px var(--shadow),
    inset 0 1px 0 rgba(255,255,255,0.28),
    inset 0 -4px 12px rgba(64, 31, 15, 0.12);
  transform: rotate(var(--tilt)) translateY(0);
  transition:
    transform 0.55s cubic-bezier(.2,.8,.2,1),
    box-shadow 0.55s ease,
    filter 0.55s ease;
  cursor: none;
  color: #2f241b;
  animation: lift-in 0.7s cubic-bezier(.2,.8,.2,1) both;
  animation-delay: calc(var(--i) * 42ms);
}

.polaroid:hover {
  transform: rotate(0deg) translateY(-6px) scale(1.018);
  box-shadow:
    0 34px 68px rgba(0,0,0,0.58),
    inset 0 1px 0 rgba(255,255,255,0.34);
  filter: saturate(1.06);
  z-index: 5;
}

.polaroid:nth-child(2n) { --tilt: 1.1deg; }
.polaroid:nth-child(3n) { --tilt: -1.8deg; }
.polaroid:nth-child(4n) { --tilt: 0.6deg; }
.polaroid:nth-child(6n + 1) { --a: #f6ba55; --b: #ed8d43; --tag: #b1422f; }
.polaroid:nth-child(6n + 2) { --a: #92bf86; --b: #75a15f; --tag: #4d7b43; }
.polaroid:nth-child(6n + 3) { --a: #64bee1; --b: #4aa8ce; --tag: #2b7ea8; }
.polaroid:nth-child(6n + 4) { --a: #eadf65; --b: #c5cf58; --tag: #7e8f34; }
.polaroid:nth-child(6n + 5) { --a: #ee7568; --b: #d85591; --tag: #b43750; }
.polaroid:nth-child(6n) { --a: #348ddd; --b: #5652b2; --tag: #334286; }

.polaroid-window {
  flex: 0 0 auto;
  aspect-ratio: 46 / 62;
  border-radius: 2px;
  display: flex;
  align-items: center;
  padding: 18px 12px;
  overflow: hidden;
  background:
    radial-gradient(circle at 12% 4%, color-mix(in srgb, var(--a) 20%, transparent), transparent 36%),
    linear-gradient(160deg, rgba(34, 27, 22, 0.98), rgba(63, 48, 39, 0.93));
  border: 1px solid rgba(51, 32, 22, 0.24);
  box-shadow:
    inset 0 0 36px rgba(0,0,0,0.34),
    0 1px 0 rgba(255,255,255,0.14);
}

.polaroid-text {
  width: 100%;
  max-height: 100%;
  overflow: hidden;
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(9.5px, 0.72vw, 11.2px);
  line-height: 1.72;
  color: #f1e5d2;
  text-align: left;
  display: -webkit-box;
  -webkit-line-clamp: 8;
  -webkit-box-orient: vertical;
}

.polaroid-caption {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
}

.polaroid-meta {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
}

.polaroid-date,
.polaroid-tag {
  display: inline-flex;
  align-items: center;
  min-height: 18px;
  padding: 3px 6px;
  font-size: 7px;
  letter-spacing: 0.17em;
  text-transform: uppercase;
}

.polaroid-date {
  color: #3f3328;
  background: rgba(255, 248, 232, 0.74);
}

.polaroid-tag {
  color: #fff7e8;
  background: var(--tag);
}

.polaroid-scene {
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid rgba(52, 42, 30, 0.16);
  width: 100%;
  font-family: 'Noto Serif SC', serif;
  font-size: 8.5px;
  line-height: 1.35;
  color: rgba(49, 38, 28, 0.72);
  text-align: left;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.polaroid-scene::before {
  content: "SCENE";
  color: var(--tag);
  font-family: 'DM Mono', monospace;
  font-size: 7px;
  letter-spacing: 0.17em;
  margin-right: 8px;
}

.polaroid-frame {
  position: absolute;
  right: 10px;
  bottom: 5px;
  color: rgba(47, 36, 27, 0.24);
  font-size: 7px;
  letter-spacing: 0.18em;
}

.hint {
  margin-top: 42px;
  text-align: center;
  color: rgba(154, 141, 121, 0.46);
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 34px;
  background: rgba(5, 4, 3, 0.76);
  backdrop-filter: blur(12px);
}

.modal.is-open {
  display: flex;
}

.modal-card {
  width: min(560px, calc(100vw - 40px));
  transform: translateY(18px) scale(0.96);
  opacity: 0;
  transition: transform 0.36s cubic-bezier(.2,.8,.2,1), opacity 0.36s ease;
}

.modal.is-open .modal-card {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.modal-polaroid {
  --a: #f6ba55;
  --b: #ed8d43;
  --tag: #b1422f;
  aspect-ratio: 54 / 86;
  max-height: 82vh;
  margin: 0 auto;
  border-radius: 8px;
  padding: 18px 18px 22px;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--a) 88%, white), var(--b)),
    var(--a);
  box-shadow:
    0 34px 92px rgba(0,0,0,0.68),
    inset 0 1px 0 rgba(255,255,255,0.32);
  color: #2f241b;
}

.modal-window {
  aspect-ratio: 46 / 62;
  padding: 38px 26px;
  display: flex;
  align-items: center;
  border-radius: 2px;
  background:
    radial-gradient(circle at 12% 4%, color-mix(in srgb, var(--a) 20%, transparent), transparent 36%),
    linear-gradient(160deg, rgba(34, 27, 22, 0.98), rgba(63, 48, 39, 0.93));
  box-shadow: inset 0 0 42px rgba(0,0,0,0.34);
}

.modal-text {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(16px, 2.7vw, 25px);
  line-height: 1.95;
  color: #f1e5d2;
}

.modal-meta {
  margin-top: 13px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.modal-date,
.modal-tag {
  padding: 5px 10px;
  font-size: 9px;
  letter-spacing: 0.17em;
}

.modal-date {
  background: rgba(255, 248, 232, 0.74);
}

.modal-tag {
  color: #fff7e8;
  background: var(--tag);
}

.modal-scene {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(52, 42, 30, 0.16);
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  line-height: 1.7;
  color: rgba(49, 38, 28, 0.75);
}

.modal-close {
  position: absolute;
  top: 26px;
  right: 32px;
  width: 36px;
  height: 36px;
  border: 1px solid rgba(244, 234, 219, 0.22);
  border-radius: 50%;
  background: rgba(11, 9, 7, 0.36);
  color: rgba(244, 234, 219, 0.78);
  font-size: 20px;
  line-height: 1;
  cursor: none;
}

.footer {
  padding: 20px 0 44px;
  text-align: center;
  color: rgba(154, 141, 121, 0.42);
  font-size: 9px;
  letter-spacing: 0.32em;
}

@keyframes lift-in {
  from { opacity: 0; transform: rotate(var(--tilt)) translateY(28px); }
  to { opacity: 1; transform: rotate(var(--tilt)) translateY(0); }
}

@media (max-width: 960px) {
  .page { width: min(820px, calc(100vw - 78px)); }
  .polaroid-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .hero { min-height: 36vh; }
}

@media (max-width: 640px) {
  body { cursor: auto; }
  .cursor-dot,
  .cursor-ring { display: none; }
  .film-perf { width: 24px; }
  .film-perf::before { inset: 14px 6px; }
  .site-nav-corner {
    top: 18px;
    right: 22px;
    gap: 14px;
  }
  .site-nav-corner__cn { font-size: 12px; }
  .site-nav-corner__en { display: none; }
  .back-link {
    position: absolute;
    top: 20px;
    left: 28px;
    font-size: 9px;
  }
  .page {
    width: calc(100vw - 48px);
    padding-top: 22px;
  }
  .hero {
    min-height: auto;
    padding: 76px 0 36px;
  }
  .hero-kicker { font-size: 10px; letter-spacing: 0.34em; }
  .hero-title { font-size: clamp(36px, 11vw, 50px); }
  .hero-subtitle {
    font-size: 12px;
    text-align: left;
  }
  .polaroid-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px 16px;
  }
  .polaroid {
    width: 100%;
    margin: 0 auto;
    padding: 8px 8px 11px;
  }
  .polaroid-window { padding: 14px 9px; }
  .polaroid-text { font-size: 9.2px; line-height: 1.6; }
  .modal { padding: 18px; }
  .modal-close {
    top: 16px;
    right: 18px;
  }
  .modal-polaroid {
    padding: 14px 14px 18px;
  }
  .modal-window {
    padding: 26px 20px;
  }
}
</style>
</head>
<body>

<main class="page">
  <section class="hero" aria-labelledby="pageTitle">
    <div class="hero-kicker">DEVELOPING ROOM</div>
    <h1 class="hero-title" id="pageTitle"><span>Thought Contact Sheet</span></h1>
    <p class="hero-subtitle">这里放一些在做AI产品时思考的痕迹。它们也许不够完整、不够成熟、但足够真实。</p>
  </section>

  <section class="contact-sheet" aria-label="Thought contact sheet">

<script>
const thoughts = [
  { text: "这段时间越用 AI 越觉得，工具的能力有多强，不只看模型参数，也看使用者的水平。能拆问题、会追问、判断结果的人，更容易把 AI 变成自己的杠杆；效率上来了，人也同时会被训练得更敏锐。", date: "2026.04", scene: "5天平地起高楼，用 Codex 写完整个开题报告", category: "认知密度" },
  { text: "“你是 XX 领域专家”在今天的AI能力下早就不必需了。把问题讲清楚，把输出要求说到位，通常已经能拿到一份不跑偏的答案。Prompt 是入口，背后真正起作用的还是你对任务和逻辑的理解。", date: "2026.03", scene: "和Claude聊天N轮", category: "认知密度" },
  { text: "AI 时代会放大人的判断力。它让执行变快，也会让错误的方向更快被执行。所以越是工具强大，越需要先想清楚为什么做、为谁做、做到什么程度。", date: "2026.03", scene: "复盘项目优先级时", category: "认知密度" },
  { text: "如果每一个新模型、新插件、新工作流都让我立刻紧张，那我可能不是在学习 AI，而是在被 AI 时代的噪音训练。真正的学习应该让我更自由，而不是更慌张。", date: "2026.03", scene: "整理工具收藏夹时", category: "认知密度" },
  { text: "我越来越觉得，AI 时代要练的不是“会不会用工具”这么简单，而是分得清边界：哪些事可以放心交给 AI，哪些判断必须由人来判断。", date: "2026.03", scene: "做 AI 产品方案时", category: "产品判断" },
  { text: "做 AI 产品时，生成本身反而没那么难。难的是面对一堆可能性时，知道哪一个值得留下、哪一个可以删掉；这个收敛的过程，才是 PM 真正要负责的部分。", date: "2026.03", scene: "做 AIGC 创意投放方案", category: "产品判断" },
  { text: "后来我发现，对抗 AI 焦虑最有效的方式，不是逼自己什么都学，而是把一个任务完整做完。做完一件事，比收藏一百个教程更能让人安定下来。", date: "2026.02", scene: "做完一个小项目后", category: "创造路径" },
  { text: "AI 很像一面认知镜子。你问得笼统，它就只能泛泛回答；你自己先想具体，它才更可能给出具体、有用的回应。", date: "2026.01", scene: "整理 Prompt 提示词", category: "认知密度" },
  { text: "我慢慢接受了，自己不可能cover所有 最新AI 资讯和变化。与其追逐每一个浪潮，不如保留一点稳定的内核：持续观察真实问题，持续做出具体东西，持续修正自己的判断。", date: "2026.01", scene: "重新梳理学习节奏时", category: "创造路径" },
  { text: "我不太相信一上来就完美的产品。很多有生命力的东西，都是先有一个粗糙但真实的内核，然后在一次次被使用、被质疑、被修改里长出来的。", date: "2026.01", scene: "喝一杯1.0版本完成", category: "创造路径" },
  { text: "Vibe coding 最让我兴奋的，不是代码一行行自动出现的那一刻，而是我意识到：非技术人员的奇思妙想也能够自己实现。", date: "2026.01", scene: "做个人网站的时候", category: "创造路径" },

const frameStyles = [
  ["#f6ba55", "#ed8d43", "#b1422f"],
  ["#92bf86", "#75a15f", "#4d7b43"],
  ["#64bee1", "#4aa8ce", "#2b7ea8"],
  ["#eadf65", "#c5cf58", "#7e8f34"],
  ["#ee7568", "#d85591", "#b43750"],
  ["#348ddd", "#5652b2", "#334286"]
];

function buildThoughts() {
  const grid = document.getElementById("thoughtGrid");
  grid.innerHTML = thoughts.map((item, index) => {
    const frame = String(index + 1).padStart(2, "0");
    return `
      <button class="polaroid magnetic-hover" type="button" data-index="${index}" style="--i:${index}" aria-label="打开第 ${index + 1} 条语录">
        <div class="polaroid-window">
          <p class="polaroid-text">${item.text}</p>
        </div>
        <div class="polaroid-caption">
          <div class="polaroid-meta">
            <span class="polaroid-date">${item.date}</span>
            <span class="polaroid-tag">${item.category}</span>
          </div>
          <p class="polaroid-scene">${item.scene}</p>
        </div>
        <span class="polaroid-frame">FRAME ${frame}</span>
      </button>
    `;
  }).join("");
}

function openThought(index) {
  const item = thoughts[index];
  const colors = frameStyles[index % frameStyles.length];
  const modal = document.getElementById("thoughtModal");
  const card = document.getElementById("modalPolaroid");
  card.style.setProperty("--a", colors[0]);
  card.style.setProperty("--b", colors[1]);
  card.style.setProperty("--tag", colors[2]);
  document.getElementById("modalText").textContent = item.text;
  document.getElementById("modalDate").textContent = item.date;
  document.getElementById("modalTag").textContent = item.category;
  document.getElementById("modalScene").textContent = item.scene;
  modal.classList.add("is-open");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeThought() {
  const modal = document.getElementById("thoughtModal");
  modal.classList.remove("is-open");
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

buildThoughts();

document.getElementById("thoughtGrid").addEventListener("click", (event) => {
  const card = event.target.closest(".polaroid");
  if (!card) return;
  openThought(Number(card.dataset.index));
});

document.querySelector(".modal-close").addEventListener("click", closeThought);
document.getElementById("thoughtModal").addEventListener("click", (event) => {
  if (event.target.id === "thoughtModal") closeThought();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeThought();
});

const cursorDot = document.getElementById("cursorDot");
const cursorRing = document.getElementById("cursorRing");
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let ringX = mouseX;
let ringY = mouseY;

window.addEventListener("mousemove", (event) => {
  mouseX = event.clientX;
  mouseY = event.clientY;
  cursorDot.style.left = mouseX + "px";
  cursorDot.style.top = mouseY + "px";
});

function animateCursor() {
  ringX += (mouseX - ringX) * 0.18;
  ringY += (mouseY - ringY) * 0.18;
  cursorRing.style.left = ringX + "px";
  cursorRing.style.top = ringY + "px";
  requestAnimationFrame(animateCursor);
}
animateCursor();

document.addEventListener("pointerover", (event) => {
  if (event.target.closest(".magnetic-hover")) cursorRing.classList.add("is-hover");
});
document.addEventListener("pointerout", (event) => {
  if (event.target.closest(".magnetic-hover")) cursorRing.classList.remove("is-hover");
});
</script>
</body>
