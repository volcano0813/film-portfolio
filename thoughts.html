<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elia's Thought Contact Sheet</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    @font-face{font-family:"Aa MeiYu JianCha";src:url("assets/fonts/AaMeiYuJianCha-web.woff2") format("woff2");font-display:swap;font-style:normal;font-weight:400}
    :root{--surface:#fff8e8;--surface-soft:#fffdf6;--ink:#171512;--ink-soft:#5b554c;--line:rgba(23,21,18,.18);--yellow:#ffd23f;--blue:#2453d4;--coral:#ff7058;--pink:#ff4f9a;--cyan:#35cfc7;--lilac:#a990e8}
    html[data-theme="darkroom"]{--surface:#080b16;--surface-soft:#111522;--ink:#f8f1df;--ink-soft:#bbb3a6;--line:rgba(255,248,232,.18)}
    *{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{min-height:100svh;background:var(--surface);color:var(--ink);font-family:"Noto Serif SC",serif;transition:background .35s ease,color .35s ease}body::after{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
    .nav{position:fixed;z-index:1000;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:6px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--surface-soft) 88%,transparent);box-shadow:0 12px 35px rgba(23,21,18,.12);backdrop-filter:blur(18px)}.nav a,.theme-toggle{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:500 10px/1 "DM Mono",monospace;letter-spacing:.08em;text-decoration:none;cursor:pointer;white-space:nowrap}.nav a:hover,.nav a:focus-visible,.nav a[aria-current="page"]{background:var(--yellow);color:#171512}.theme-toggle{background:#171512;color:#fff8e8}.theme-toggle:hover,.theme-toggle:focus-visible{background:var(--blue)}.theme-orb{width:12px;height:12px;border-radius:50%;background:var(--yellow);box-shadow:inset -3px -2px 0 rgba(23,21,18,.35)}
    main{padding:132px clamp(22px,6vw,90px) 100px;position:relative;overflow:hidden}main::before{content:"";position:absolute;width:55vw;height:55vw;left:-24vw;top:-25vw;border-radius:50%;background:var(--pink);opacity:.48}.hero{position:relative;z-index:2;width:min(1240px,100%);margin:0 auto 80px}.kicker{margin-bottom:20px;padding-right:112px;font:500 11px/1 "DM Mono",monospace;letter-spacing:.17em}.hero h1{font:400 clamp(42px,7.5vw,105px)/.9 "Archivo Black",sans-serif;letter-spacing:-.07em;white-space:nowrap}.hero h1 em{color:var(--blue);font-family:"Playfair Display",serif;font-weight:600}.hero-close{position:absolute;top:-9px;right:0;padding:8px 16px;border:1px solid var(--ink-soft);background:transparent;color:var(--ink-soft);font:500 11px/1 "DM Mono",monospace;letter-spacing:2px;text-decoration:none;transition:color .3s,border-color .3s,background .3s}.hero-close:hover,.hero-close:focus-visible{border-color:var(--ink);background:var(--ink);color:var(--surface);outline:none}
    .hero-close{display:grid;width:42px;height:42px;padding:0;place-items:center;border:2px solid #171512;border-radius:50%;background:var(--yellow);color:#171512;font:400 24px/1 "DM Mono",monospace;letter-spacing:0}.hero-close:hover,.hero-close:focus-visible{border-color:#171512;background:var(--coral);color:#171512;outline:none}
    .filters{position:relative;z-index:2;width:min(1240px,100%);display:flex;gap:9px;flex-wrap:wrap;margin:0 auto 36px}.filter{padding:10px 15px;border:2px solid #171512;border-radius:999px;background:var(--surface-soft);color:var(--ink);font:700 10px/1 "DM Mono",monospace;cursor:pointer;box-shadow:2px 3px 0 #171512}.filter.active{background:var(--yellow);color:#171512;transform:translate(1px,1px);box-shadow:1px 2px 0 #171512}
    .grid{position:relative;z-index:2;width:min(1240px,100%);margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:42px 30px;align-items:start}.card{--frame:linear-gradient(165deg,#a990e8 0%,#7fd1d4 54%,#35a783 100%);--rotate:-1.4deg;position:relative;display:flex;aspect-ratio:54/86;padding:12px 12px 0;flex-direction:column;border:1px solid rgba(23,21,18,.25);border-radius:4px;background:var(--frame);color:#171512;box-shadow:8px 12px 20px rgba(49,37,43,.28);text-align:left;cursor:pointer;transform:rotate(var(--rotate));transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease}.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");mix-blend-mode:multiply}.card:nth-child(6n+2){--frame:linear-gradient(165deg,#df7788 0%,#e294b7 48%,#8f76c7 100%);--rotate:1.2deg}.card:nth-child(6n+3){--frame:linear-gradient(165deg,#79d5df 0%,#f2c6db 58%,#f49bae 100%);--rotate:-1deg}.card:nth-child(6n+4){--frame:linear-gradient(165deg,#b19ce8 0%,#d9c8ef 48%,#79ced2 100%);--rotate:1.5deg}.card:nth-child(6n+5){--frame:linear-gradient(165deg,#efb06f 0%,#f4d88f 48%,#e9867b 100%);--rotate:-1.3deg}.card:nth-child(6n+6){--frame:linear-gradient(165deg,#8fd267 0%,#b7ddb3 52%,#62b7b8 100%);--rotate:.8deg}.card:hover,.card:focus-visible{z-index:3;transform:translateY(-12px) rotate(0) scale(1.015);box-shadow:12px 18px 28px rgba(49,37,43,.34);outline:none}.card:focus-visible{outline:3px solid var(--blue);outline-offset:5px}.card-photo{position:relative;display:flex;width:100%;aspect-ratio:46/62;min-height:0;padding:28px 21px;flex:0 1 auto;flex-direction:column;overflow:hidden;border:1px solid rgba(23,21,18,.14);background:#fffefa}.card-photo::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.72),transparent 42%,rgba(23,21,18,.03))}.card-text{position:relative;font-family:"Aa MeiYu JianCha","Kaiti SC","KaiTi","STKaiti",serif;font-size:clamp(17px,1.25vw,21px);font-weight:400;line-height:1.62;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}.card-caption{position:relative;display:flex;min-height:66px;padding:12px 6px 11px;align-items:flex-end;justify-content:space-between;gap:14px}.card-caption strong{font-family:"Aa MeiYu JianCha","Kaiti SC","KaiTi","STKaiti",serif;font-size:16px;font-weight:400;transform:rotate(-2deg)}.card-caption small{font:500 9px/1.45 "DM Mono",monospace;letter-spacing:.08em;text-align:right}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--ink-soft)}
    .card-caption small{font-family:"Aa MeiYu JianCha","Kaiti SC","KaiTi","STKaiti",serif;font-size:16px;font-weight:400;line-height:1;letter-spacing:normal;text-align:right}.card-text,.modal-text{white-space:pre-line}
    footer{padding:30px 24px;border-top:1px solid var(--line);color:var(--ink-soft);text-align:center;font:500 9px/1.5 "DM Mono",monospace;letter-spacing:.16em}.modal{position:fixed;inset:0;z-index:2000;display:none;place-items:center;padding:24px;background:rgba(23,21,18,.56);backdrop-filter:blur(12px)}.modal.open{display:grid}.modal-card{width:min(700px,100%);padding:clamp(30px,5vw,58px);border:3px solid #171512;border-radius:32px;background:var(--modal-color,var(--cyan));color:#171512;box-shadow:14px 16px 0 #171512;transform:rotate(-1deg)}.modal-close{float:right;width:42px;height:42px;border:2px solid #171512;border-radius:50%;background:transparent;font-size:20px;cursor:pointer}.modal-text{clear:both;padding-top:24px;font-size:clamp(20px,3vw,32px);font-weight:700;line-height:1.65}.modal-meta{display:flex;justify-content:space-between;gap:20px;margin-top:30px;font:500 11px/1.6 "DM Mono",monospace}
    html.is-thought-modal-open,body.is-thought-modal-open{overflow:hidden!important;overscroll-behavior:none}
    .modal{display:grid;background:rgba(23,21,18,.54);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s ease,visibility 0s linear .28s}
    .modal.open{opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
    .modal-card{position:relative;display:flex;box-sizing:border-box;width:min(440px,calc(100vw - 32px),calc((100dvh - 48px) * .6279));aspect-ratio:54/86;padding:14px 14px 0;flex-direction:column;overflow:hidden;border:1px solid rgba(23,21,18,.35);border-radius:3px;background:var(--modal-frame,linear-gradient(165deg,#a990e8,#7fd1d4 54%,#35a783));color:#171512;box-shadow:18px 24px 34px rgba(23,21,18,.42);transform:rotate(-1.1deg)}
    .modal-photo-shell{position:relative;width:100%;aspect-ratio:46/62;min-height:0}
    .modal-photo{position:relative;display:flex;box-sizing:border-box;width:100%;height:100%;padding:clamp(40px,5vw,48px) clamp(26px,4vw,34px);align-items:flex-start;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:none;background:#fffefa;border:1px solid rgba(23,21,18,.12)}
    .modal-photo::-webkit-scrollbar{display:none}.modal-photo::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.72),transparent 40%,rgba(23,21,18,.025))}
    .modal-close{position:absolute;top:24px;right:24px;z-index:4;display:grid;float:none;width:40px;height:40px;padding:0;place-items:center;border:2px solid currentColor;border-radius:50%;background:rgba(255,254,250,.86);color:inherit;box-shadow:3px 3px 0 rgba(23,21,18,.9);cursor:pointer;font:400 22px/1 "DM Mono",monospace}.modal-close:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(23,21,18,.9)}.modal-close:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
    .modal-text{position:relative;z-index:1;clear:none;margin:0;padding:0;font-family:"Aa MeiYu JianCha","Kaiti SC","KaiTi","STKaiti",serif;font-size:clamp(18px,2.8vw,24px);font-weight:400;line-height:1.6;white-space:pre-line}
    .modal-meta{display:flex;min-height:76px;margin:0;padding:18px 8px 16px;align-items:center;justify-content:space-between;gap:16px;font-family:"Aa MeiYu JianCha","Kaiti SC","KaiTi","STKaiti",serif;font-size:clamp(17px,2.5vw,21px);font-weight:400;line-height:1}
    .modal-scrollbar{position:absolute;top:62px;right:10px;bottom:20px;z-index:3;width:7px;overflow:hidden;border:1px solid rgba(23,21,18,.28);border-radius:999px;background:rgba(23,21,18,.08);box-shadow:inset 0 0 0 2px rgba(255,254,250,.7);opacity:0;transition:opacity .2s ease}.modal-scrollbar.is-scrollable{opacity:1}.modal-scrollbar-thumb{display:block;width:100%;min-height:34px;border:1px solid #fffefa;border-radius:inherit;background:rgba(23,21,18,.72);transform:translateY(0);will-change:transform}
    @media(max-width:480px){.modal{padding:16px}.modal-card{width:min(calc(100vw - 32px),calc((100dvh - 32px) * .6279));padding:10px 10px 0}.modal-photo{padding:24px 30px 24px 22px}.modal-close{top:18px;right:18px;width:36px;height:36px;font-size:19px}.modal-text{font-size:clamp(17px,4.6vw,19px)}.modal-meta{min-height:60px;padding:12px 5px;font-size:17px}.modal-scrollbar{top:54px;right:7px;bottom:16px;width:6px}}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){.nav{width:calc(100% - 24px);top:10px;justify-content:flex-start;overflow-x:auto}.nav a,.theme-toggle{flex:0 0 auto;padding-inline:13px}main{padding:112px 20px 80px}.hero h1{font-size:clamp(36px,7.6vw,47px)}.grid{grid-template-columns:1fr;gap:34px}.card-text{font-size:clamp(19px,5.2vw,22px)}.hero{margin-bottom:55px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.card{transform:none}}
  </style>
</head>
<body>
  <nav class="nav" aria-label="主要导航"><a href="index.html#opening">Opening</a><a href="index.html#works">Projects</a><a href="thoughts.html" aria-current="page">Thoughts</a><a href="about.html">About</a><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false"><span class="theme-orb" aria-hidden="true"></span><span data-theme-label>DARKROOM</span></button></nav>
  <main>
    <header class="hero"><a class="hero-close" href="index.html#thoughts" aria-label="关闭思考页，返回首页思考章节">×</a><div class="kicker">03 / DEVELOPING ROOM · 14 FRAMES</div><h1>Thought <em>Contact Sheet</em></h1></header>
    <div class="filters" id="filters" aria-label="按类别筛选"></div>
    <section class="grid" id="thoughtGrid" aria-live="polite" aria-label="全部思考"></section>
  </main>
  <footer>—— END OF CONTACT SHEET · FRAME 14 / 36 ——</footer>
  <div class="modal" id="thoughtModal" aria-hidden="true"><article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalText"><button class="modal-close" type="button" aria-label="关闭">×</button><div class="modal-photo-shell"><div class="modal-photo" tabindex="0" aria-label="完整思考内容，可上下滚动"><p class="modal-text" id="modalText"></p></div><span class="modal-scrollbar" aria-hidden="true"><span class="modal-scrollbar-thumb"></span></span></div><div class="modal-meta"><span id="modalCategory"></span><span id="modalDate"></span></div></article></div>
  <script src="assets/thoughts-data.js"></script>
  <script>
    const thoughts=window.ELIA_THOUGHTS||[];const frames=['linear-gradient(165deg,#a990e8 0%,#7fd1d4 54%,#35a783 100%)','linear-gradient(165deg,#df7788 0%,#e294b7 48%,#8f76c7 100%)','linear-gradient(165deg,#79d5df 0%,#f2c6db 58%,#f49bae 100%)','linear-gradient(165deg,#b19ce8 0%,#d9c8ef 48%,#79ced2 100%)','linear-gradient(165deg,#efb06f 0%,#f4d88f 48%,#e9867b 100%)','linear-gradient(165deg,#8fd267 0%,#b7ddb3 52%,#62b7b8 100%)'];const grid=document.getElementById('thoughtGrid');const filters=document.getElementById('filters');const categories=['全部',...new Set(thoughts.map(item=>item.category))];let activeCategory='全部';let modalTrigger=null;let modalBodyOverflow='';
    filters.innerHTML=categories.map((category,index)=>`<button class="filter${index===0?' active':''}" type="button" data-category="${category}" aria-pressed="${index===0}">${category}</button>`).join('');
    function render(){const visible=activeCategory==='全部'?thoughts:thoughts.filter(item=>item.category===activeCategory);grid.innerHTML=visible.length?visible.map(item=>{const index=thoughts.indexOf(item);return `<button class="card" type="button" data-index="${index}" aria-label="打开第 ${index+1} 条思考"><span class="card-photo"><span class="card-text">${item.text}</span></span><span class="card-caption"><strong>${item.category}</strong><small>${item.date}</small></span></button>`}).join(''):'<p class="empty">这一卷暂时没有内容。</p>'}
    filters.addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;activeCategory=button.dataset.category;filters.querySelectorAll('.filter').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active))});render()});
    const modal=document.getElementById('thoughtModal');const closeButton=modal.querySelector('.modal-close');const modalPhoto=modal.querySelector('.modal-photo');const modalScrollbar=modal.querySelector('.modal-scrollbar');const modalScrollbarThumb=modal.querySelector('.modal-scrollbar-thumb');
    function updateModalScrollbar(){const maxScroll=modalPhoto.scrollHeight-modalPhoto.clientHeight;const trackHeight=modalScrollbar.clientHeight;const scrollable=maxScroll>1&&trackHeight>0;modalScrollbar.classList.toggle('is-scrollable',scrollable);if(!scrollable){modalScrollbarThumb.style.height='100%';modalScrollbarThumb.style.transform='translateY(0)';return}const thumbHeight=Math.max(34,trackHeight*(modalPhoto.clientHeight/modalPhoto.scrollHeight));const travel=Math.max(0,trackHeight-thumbHeight);const thumbOffset=travel*(modalPhoto.scrollTop/maxScroll);modalScrollbarThumb.style.height=`${thumbHeight}px`;modalScrollbarThumb.style.transform=`translateY(${thumbOffset}px)`}
    modalPhoto.addEventListener('scroll',updateModalScrollbar,{passive:true});window.addEventListener('resize',updateModalScrollbar,{passive:true});
    function openThought(index,trigger){const item=thoughts[index];if(!item)return;modalTrigger=trigger;modal.style.setProperty('--modal-frame',frames[index%frames.length]);document.getElementById('modalText').textContent=item.text;modalPhoto.scrollTop=0;document.getElementById('modalCategory').textContent=item.category;document.getElementById('modalDate').textContent=item.date;modal.classList.add('open');modal.setAttribute('aria-hidden','false');modalBodyOverflow=document.body.style.overflow;document.documentElement.classList.add('is-thought-modal-open');document.body.classList.add('is-thought-modal-open');document.body.style.overflow='hidden';requestAnimationFrame(()=>requestAnimationFrame(updateModalScrollbar));closeButton.focus()}
    function closeThought(){if(!modal.classList.contains('open'))return;modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.documentElement.classList.remove('is-thought-modal-open');document.body.classList.remove('is-thought-modal-open');document.body.style.overflow=modalBodyOverflow;if(modalTrigger)modalTrigger.focus({preventScroll:true})}
    grid.addEventListener('click',event=>{const card=event.target.closest('[data-index]');if(card)openThought(Number(card.dataset.index),card)});closeButton.addEventListener('click',closeThought);modal.addEventListener('click',event=>{if(event.target===modal)closeThought()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeThought()});render();
  </script>
</body>
