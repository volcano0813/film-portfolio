<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>底片 Negative - Elia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --film-black: #1a1714;
      --film-dark: #2a2520;
      --film-brown: #3d3530;
      --film-warm: #6b5b4f;
      --film-tan: #a08e7a;
      --film-cream: #d4c5a9;
      --film-light: #e8dcc8;
      --film-white: #f5f0e6;
      --kodak-yellow: #f5c518;
      --film-orange: #d4873f;
      --sprocket-size: 12px;
      --perf-gap: 28px;
      /* 胶卷走带（别名，指向既有色板） */
      --bg-deep: var(--film-black);
      --film-border: var(--film-brown);
      --accent-gold: var(--kodak-yellow);
      --text-secondary: var(--film-cream);
      --text-primary: var(--film-white);
      --text-muted: var(--film-tan);
      --bg-frame: rgba(22, 30, 40, 0.98);
      --bg-frame-hover: rgba(28, 40, 54, 0.98);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--film-black);
      color: var(--film-cream);
      font-family: "IBM Plex Mono", "Noto Serif SC", monospace;
      overflow-x: hidden;
    }

    .develop-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--film-light);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.6s ease;
      mix-blend-mode: difference;
    }
    .develop-overlay.developing { opacity: 0.6; }
    .develop-overlay.done {
      opacity: 0;
      mix-blend-mode: normal;
    }

    .film-border {
      position: fixed;
      top: 0;
      width: 32px;
      height: 100vh;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--perf-gap);
      padding-top: 10px;
      overflow: hidden;
    }
    .film-border.left {
      left: 0;
      background: var(--film-black);
      border-right: 1px solid var(--film-brown);
    }
    .film-border.right {
      right: 0;
      background: var(--film-black);
      border-left: 1px solid var(--film-brown);
    }
    .sprocket {
      width: var(--sprocket-size);
      height: var(--sprocket-size);
      border-radius: 2px;
      border: 1px solid var(--film-brown);
      flex-shrink: 0;
      opacity: 0.5;
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 50px;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--film-tan);
      text-decoration: none;
      z-index: 200;
      transition: color 0.3s;
      opacity: 0.7;
    }
    .back-link:hover {
      color: var(--kodak-yellow);
      opacity: 1;
    }

    .content {
      margin: 0 32px;
      min-height: 100vh;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 72px 40px 84px;
      overflow: hidden;
      background: var(--film-black);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: none;
      pointer-events: none;
    }
    .hero-index-line {
      width: min(980px, calc(100vw - 140px));
      margin-bottom: 54px;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #6a5a3a;
      text-transform: uppercase;
      animation: fadeUp 1.2s ease-out both;
    }
    .frame-number {
      position: absolute;
      top: 30px;
      left: 50px;
      font-size: 11px;
      color: var(--kodak-yellow);
      letter-spacing: 3px;
      opacity: 0.7;
    }
    .frame-counter {
      position: absolute;
      top: 30px;
      right: 50px;
      font-size: 11px;
      color: var(--film-tan);
      letter-spacing: 2px;
      opacity: 0.5;
    }
    .hero-title-group {
      text-align: center;
      margin-bottom: 42px;
      animation: fadeUp 1.2s ease-out both;
    }
    .hero-label {
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--film-tan);
      margin-bottom: 20px;
      opacity: 0.6;
    }
    .hero-title {
      font-family: "Playfair Display", "Noto Serif SC", serif;
      font-size: clamp(2.6rem, 6vw, 4.8rem);
      font-weight: 400;
      color: var(--film-white);
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .hero-title em {
      font-style: italic;
      color: var(--kodak-yellow);
    }
    .hero-subtitle {
      font-size: 13px;
      color: var(--film-tan);
      letter-spacing: 2px;
      font-weight: 300;
    }

    .darkroom-desk {
      width: min(980px, calc(100vw - 140px));
      position: relative;
      background: var(--film-black);
      animation: fadeUp 1.2s ease-out 0.18s both;
    }

    .darkroom-desk-head {
      display: block;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--film-brown);
    }

    .darkroom-kicker {
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #6a5a3a;
      margin-bottom: 10px;
    }

    .darkroom-title {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(1.35rem, 2.7vw, 2rem);
      color: var(--film-white);
      font-weight: 600;
      line-height: 1.35;
    }

    .darkroom-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      padding: 28px 0 24px;
    }

    .darkroom-step {
      position: relative;
      min-height: 188px;
      padding: 18px 16px 16px;
      border: 1px solid var(--film-brown);
      background:
        linear-gradient(180deg, rgba(42, 37, 32, 0.72), rgba(26, 23, 20, 0.94));
      overflow: hidden;
    }

    .darkroom-step::before {
      content: attr(data-step);
      position: absolute;
      right: 14px;
      top: 12px;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(160, 142, 122, 0.34);
    }

    .darkroom-step::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: var(--step-color);
      opacity: 0.78;
    }

    .darkroom-step-word {
      font-family: "Playfair Display", "Noto Serif SC", serif;
      font-size: 23px;
      line-height: 1;
      font-style: italic;
      color: var(--step-color);
      margin-bottom: 14px;
      letter-spacing: 0;
    }

    .darkroom-step-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--film-warm);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .darkroom-step-text {
      font-family: "Noto Serif SC", serif;
      font-size: 13px;
      line-height: 1.8;
      color: var(--film-cream);
    }

    .darkroom-signal {
      display: grid;
      grid-template-columns: 92px 1fr 92px;
      gap: 16px;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--film-brown);
      font-size: 9px;
      letter-spacing: 0.24em;
      color: rgba(160, 142, 122, 0.55);
      text-transform: uppercase;
    }

    .darkroom-signal-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--kodak-yellow), transparent);
      opacity: 0.46;
    }

    .darkroom-signal-end {
      text-align: right;
    }

    /* ===== 胶卷走带 ===== */
    .strip-container {
      width: 100vw;
      position: relative;
      margin-left: calc(-50vw + 50%);
      padding: 2rem 0;
    }

    .strip-container::before,
    .strip-container::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: clamp(60px, 12vw, 140px);
      z-index: 10;
      pointer-events: none;
    }

    .strip-container::before {
      left: 0;
      background: linear-gradient(90deg, var(--bg-deep) 0%, var(--bg-deep) 10%, transparent 100%);
    }

    .strip-container::after {
      right: 0;
      background: linear-gradient(-90deg, var(--bg-deep) 0%, var(--bg-deep) 10%, transparent 100%);
    }

    .perf-bar {
      display: flex;
      width: max-content;
      animation: strip-scroll 75s linear infinite;
    }

    .perf-bar.top { margin-bottom: 2px; }
    .perf-bar.bottom { margin-top: 2px; }

    .strip-container:hover .perf-bar,
    .strip-container:hover .frames-track {
      animation-play-state: paused;
    }

    .perf-segment {
      display: flex;
      gap: 14px;
      padding: 4px 10px;
      background: rgba(12, 18, 25, 0.8);
      flex-shrink: 0;
    }

    .perf-segment .perf {
      width: 10px;
      height: 6px;
      border: 1px solid rgba(80, 96, 112, 0.2);
      border-radius: 1px;
      background: rgba(12, 18, 25, 0.8);
      flex-shrink: 0;
    }

    .frames-track {
      display: flex;
      width: max-content;
      animation: strip-scroll 75s linear infinite;
    }

    @keyframes strip-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .strip-frame {
      position: relative;
      width: 260px;
      flex-shrink: 0;
      cursor: pointer;
      background: rgba(22, 30, 40, 0.6);
      border-left: 1px solid var(--film-border);
      border-right: 1px solid var(--film-border);
      transition: background 0.3s ease;
    }

    .strip-frame:hover {
      background: rgba(28, 40, 54, 0.8);
    }

    .strip-frame-body {
      position: relative;
      overflow: hidden;
      padding: 1rem 1rem 0.6rem;
      display: flex;
      align-items: center;
      min-height: 80px;
    }

    .strip-frame-body::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 20px;
      background: linear-gradient(transparent, var(--bg-frame));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .strip-frame.has-more .strip-frame-body::after {
      opacity: 1;
    }

    .strip-frame:hover .strip-frame-body::after {
      background: linear-gradient(transparent, var(--bg-frame-hover));
    }

    .strip-frame-text {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-family: "Noto Serif SC", serif;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.85;
    }

    .strip-frame:hover .strip-frame-text {
      color: var(--text-primary);
    }

    .strip-frame-expand {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.5rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 2;
    }

    .strip-frame:hover .strip-frame-expand {
      opacity: 0.7;
    }

    .strip-frame-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 1rem 0.55rem;
      border-top: 1px solid rgba(42, 58, 72, 0.25);
    }

    .strip-frame-exp {
      font-family: "Space Grotesk", "IBM Plex Mono", monospace;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-weight: 500;
    }

    .strip-frame-meta {
      font-size: 0.52rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .strip-divider {
      width: 2px;
      flex-shrink: 0;
      background: rgba(12, 18, 25, 0.8);
    }

    /* ===== 灯箱 ===== */
    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 12, 18, 0);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: background 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 2rem;
    }

    .lightbox-backdrop.active {
      background: rgba(6, 12, 18, 0.88);
      pointer-events: all;
    }

    .lightbox-frame {
      width: 100%;
      max-width: 480px;
      background: #141c26;
      border: 1px solid var(--film-border);
      position: relative;
      opacity: 0;
      transform: scale(0.9) translateY(20px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lightbox-backdrop.active .lightbox-frame {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .lb-perfs {
      display: flex;
      justify-content: space-between;
      padding: 6px 14px;
      background: rgba(12, 18, 25, 0.8);
    }

    .lb-perf {
      width: 12px;
      height: 7px;
      border: 1px solid rgba(80, 96, 112, 0.2);
      border-radius: 1px;
      background: rgba(12, 18, 25, 0.8);
    }

    .lb-body {
      padding: 1.8rem 1.6rem 1.2rem;
    }

    .lb-text {
      font-family: "Noto Serif SC", serif;
      font-size: 1rem;
      color: var(--text-primary);
      line-height: 2;
      white-space: pre-line;
    }

    .lb-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 1rem 1.6rem 1.2rem;
      border-top: 1px solid rgba(42, 58, 72, 0.3);
    }

    .lb-exp {
      font-family: "Space Grotesk", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-weight: 500;
    }

    .lb-meta-group {
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .lb-date {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .lb-scene {
      font-size: 0.6rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .lb-close {
      position: absolute;
      top: -36px;
      right: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.3s ease;
      font-family: "Space Grotesk", sans-serif;
    }

    .lb-close:hover {
      color: var(--accent-gold);
    }

    body.lb-open,
    body.wc-open {
      overflow: hidden;
    }

    .hero-label.strip-hint {
      margin-top: 1.25rem;
      margin-bottom: 0;
      text-align: center;
      max-width: 100%;
    }

    .section {
      padding: 100px 40px;
      max-width: 980px;
      margin: 0 auto;
      position: relative;
    }
    .section + .section { border-top: 1px solid var(--film-brown); }
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 50px;
    }
    .section-code {
      font-size: 10px;
      color: var(--kodak-yellow);
      letter-spacing: 3px;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .section-title {
      font-family: "Playfair Display", "Noto Serif SC", serif;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 400;
      color: var(--film-white);
    }
    .section-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--film-brown), transparent);
      margin-left: 16px;
    }

    .origin-grid {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 0 40px;
    }
    .origin-divider { background: var(--film-brown); position: relative; }
    .origin-divider::after {
      content: "◆";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--kodak-yellow);
      font-size: 8px;
    }
    .origin-col { display: flex; flex-direction: column; gap: 32px; }
    .origin-year { font-size: 10px; letter-spacing: 3px; color: var(--film-orange); margin-bottom: 8px; }
    .origin-label {
      font-family: "Noto Serif SC", serif;
      font-size: 16px;
      color: var(--film-white);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .origin-desc {
      font-size: 12px;
      line-height: 1.9;
      color: var(--film-tan);
      font-weight: 300;
    }

    .thought-archive {
      position: relative;
      padding: 12px 0 6px;
    }
    .thought-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      margin-bottom: 38px;
      padding-bottom: 28px;
      border-bottom: 0.5px solid #1f1a14;
    }
    .thought-kicker {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--film-orange);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .thought-summary {
      max-width: 680px;
      font-size: 12px;
      line-height: 2;
      color: var(--film-tan);
      font-weight: 300;
    }
    .thought-count {
      min-width: 130px;
      border: 1px solid rgba(212, 160, 74, 0.32);
      padding: 16px 18px;
      text-align: center;
      color: var(--film-warm);
      letter-spacing: 2px;
      font-size: 9px;
      text-transform: uppercase;
    }
    .thought-count strong {
      display: block;
      font-family: "Playfair Display", serif;
      font-size: 34px;
      line-height: 1;
      color: var(--film-white);
      letter-spacing: 0;
      margin-bottom: 6px;
    }
    .thought-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 34px 26px;
      align-items: start;
      padding: 8px 4px 24px;
    }
    .thought-card {
      --accent: #d18a2d;
      --frame-a: #f0a32f;
      --frame-b: #df6f29;
      --tilt: -1deg;
      position: relative;
      aspect-ratio: 54 / 86;
      min-height: auto;
      padding: 16px 16px 18px;
      border-radius: 6px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--frame-a) 92%, white), var(--frame-b)),
        var(--frame-a);
      color: #241a12;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.36),
        inset 0 2px 0 rgba(255, 255, 255, 0.24),
        inset 0 -3px 10px rgba(75, 42, 24, 0.12);
      transform: rotate(var(--tilt)) translateY(0);
      transform-origin: 50% 30%;
      transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.42s ease, filter 0.42s ease;
      will-change: transform;
    }
    .thought-card::before {
      content: attr(data-frame);
      position: absolute;
      right: 16px;
      bottom: 8px;
      font-size: 8px;
      letter-spacing: 0.18em;
      color: rgba(45, 36, 26, 0.28);
      z-index: 3;
    }
    .thought-card::after {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      width: 72px;
      height: 24px;
      background: rgba(226, 206, 164, 0.62);
      border: 1px solid rgba(126, 98, 58, 0.18);
      transform: translateX(-50%) rotate(calc(var(--tilt) * -0.65));
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.14);
      pointer-events: none;
      z-index: 4;
    }
    .thought-card.featured {
      grid-column: auto;
    }
    .thought-card:hover {
      transform: rotate(0deg) translateY(-9px) scale(1.018);
      box-shadow:
        0 28px 58px rgba(0, 0, 0, 0.46),
        0 2px 0 rgba(255, 255, 255, 0.55) inset;
      filter: saturate(1.05);
      z-index: 8;
    }
    .thought-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
    }
    .thought-card:nth-child(2n) { --tilt: 1.4deg; }
    .thought-card:nth-child(3n) { --tilt: -1.8deg; }
    .thought-card:nth-child(4n) { --tilt: 0.9deg; }
    .thought-card:nth-child(5n) { --tilt: -0.6deg; }
    .thought-card:nth-child(6n + 1) { --accent: #d18a2d; --frame-a: #f0a32f; --frame-b: #df6f29; }
    .thought-card:nth-child(6n + 2) { --accent: #6d9a63; --frame-a: #8caf79; --frame-b: #6e925a; }
    .thought-card:nth-child(6n + 3) { --accent: #3f9ac6; --frame-a: #5bb9dc; --frame-b: #43a3c7; }
    .thought-card:nth-child(6n + 4) { --accent: #c8bd43; --frame-a: #e6d85a; --frame-b: #bdc957; }
    .thought-card:nth-child(6n + 5) { --accent: #c84d63; --frame-a: #ef6d5e; --frame-b: #cf4f8d; }
    .thought-card:nth-child(6n) { --accent: #4a5fab; --frame-a: #2e82cf; --frame-b: #4b4d9f; }
    .thought-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 6px;

  <script>
    function fillSprockets(el) {
      const count = Math.ceil(window.innerHeight / 40);
      for (let i = 0; i < count; i += 1) {
        const s = document.createElement("div");
        s.className = "sprocket";
        el.appendChild(s);
      }
    }
    fillSprockets(document.getElementById("leftSprockets"));
    fillSprockets(document.getElementById("rightSprockets"));

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) entry.target.classList.add("visible");
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));

    let ticking = false;
    window.addEventListener("scroll", () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          const scrollY = window.scrollY;
          document.getElementById("leftSprockets").style.transform = `translateY(${-scrollY * 0.15}px)`;
          document.getElementById("rightSprockets").style.transform = `translateY(${-scrollY * 0.1}px)`;
          ticking = false;
        });
        ticking = true;
      }
    });

    window.addEventListener("load", () => {
      const overlay = document.getElementById("developOverlay");
      if (overlay) {
        overlay.classList.add("developing");
        setTimeout(() => overlay.classList.add("done"), 800);
      }
    });

        var html = "";

            var num = String(i + 1).padStart(2, "0");
            html += '<div class="strip-divider"></div>';
            html += '<div class="strip-frame" data-idx="' + i + '">';
            html += '<span class="strip-frame-expand">CLICK</span>';
            html += '<div class="strip-frame-body"><p class="strip-frame-text">' + thoughts[i].text + "</p></div>";
            html += '<div class="strip-frame-footer"><span class="strip-frame-exp">EXP ' + num + "</span>";
            html += '<span class="strip-frame-meta">' + thoughts[i].date + "</span></div>";
            html += "</div>";
          }
        }
        container.innerHTML = html;

        container.querySelectorAll(".strip-frame").forEach(function (frame) {
          var textEl = frame.querySelector(".strip-frame-text");
          if (textEl && textEl.scrollHeight > textEl.clientHeight + 2) {
            frame.classList.add("has-more");

        board.innerHTML = "";
        thoughts.forEach(function (item, idx) {

          card.setAttribute("tabindex", "0");

          var meta = document.createElement("div");

          meta.appendChild(date);
          meta.appendChild(category);

          var text = document.createElement("p");
          text.className = "thought-text";
          text.textContent = item.text;

          var scene = document.createElement("div");
          scene.className = "thought-scene";
          scene.textContent = item.scene || "";

          card.appendChild(meta);
          card.appendChild(text);
          card.appendChild(scene);
          card.addEventListener("click", function () {
            openLightbox(idx);
          });
          card.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openLightbox(idx);
            }
          });
          board.appendChild(card);
        });
      }

      function buildPerfs(id) {
        var container = document.getElementById(id);
        if (!container) return;
        var html = "";
        for (var s = 0; s < thoughts.length * 2; s++) {
          html += '<div class="perf-segment">';
          for (var p = 0; p < 12; p++) {
            html += '<span class="perf"></span>';
          }
          html += "</div>";
        }
        container.innerHTML = html;
      }

      function buildLbPerfs(id) {
        var container = document.getElementById(id);
        if (!container) return;
        var html = "";
        for (var i = 0; i < 16; i++) {
          html += '<span class="lb-perf"></span>';
        }
        container.innerHTML = html;
      }

      var backdrop = document.getElementById("lbBackdrop");
      var lbText = document.getElementById("lbText");
      var lbExp = document.getElementById("lbExp");
      var lbDate = document.getElementById("lbDate");
      var lbScene = document.getElementById("lbScene");
      var lbClose = document.getElementById("lbClose");

      function openLightbox(idx) {
        if (idx < 0 || idx >= thoughts.length || !lbText || !backdrop) return;
        var t = thoughts[idx];
        var num = String(idx + 1).padStart(2, "0");
        lbText.textContent = t.text;
        if (lbExp) lbExp.textContent = "EXP " + num;
        if (lbDate) lbDate.textContent = t.date;
        if (lbScene) lbScene.textContent = t.scene || "";
        backdrop.classList.add("active");
        document.body.classList.add("lb-open");
      }

      function closeLightbox() {
        if (backdrop) backdrop.classList.remove("active");
        document.body.classList.remove("lb-open");
      }

      if (backdrop) {
        backdrop.addEventListener("click", function (e) {
          if (e.target === backdrop) closeLightbox();
        });
      }
      if (lbClose) {
        lbClose.addEventListener("click", function (e) {
          e.stopPropagation();
          closeLightbox();
        });
      }
      var wechatBackdrop = document.getElementById("wechatModal");
      function closeWechatModal() {
        if (!wechatBackdrop) return;
        wechatBackdrop.classList.remove("active");
        wechatBackdrop.setAttribute("aria-hidden", "true");
        document.body.classList.remove("wc-open");
      }
      function openWechatModal() {
        if (!wechatBackdrop) return;
        wechatBackdrop.classList.add("active");
        wechatBackdrop.setAttribute("aria-hidden", "false");
        document.body.classList.add("wc-open");
      }
      var wechatBtn = document.getElementById("wechatConnectBtn");
      var wechatClose = document.getElementById("wechatModalClose");
      if (wechatBtn) wechatBtn.addEventListener("click", openWechatModal);
      if (wechatBackdrop) {
        wechatBackdrop.addEventListener("click", function (e) {
          if (e.target === wechatBackdrop) closeWechatModal();
        });
      }
      if (wechatClose) {
        wechatClose.addEventListener("click", function (e) {
          e.stopPropagation();
          closeWechatModal();
        });
      }
      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape") return;
        if (wechatBackdrop && wechatBackdrop.classList.contains("active")) {
          closeWechatModal();
          return;
        }
        closeLightbox();
      });

      buildFrames();
      buildThoughtBoard();
      buildPerfs("perfTop");
      buildPerfs("perfBottom");
      buildLbPerfs("lbPerfsTop");
      buildLbPerfs("lbPerfsBottom");
    })();
  </script>
</body>
</html>
